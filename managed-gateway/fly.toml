# fly.toml app configuration file generated for realbud-managed-gateway
app = 'realbud-managed-gateway'
primary_region = 'syd'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8787'
  REALBUD_GATEWAY_DATA = '/data'
  REALBUD_ALLOWED_ORIGINS = 'https://realbud.app,https://www.realbud.app'
  # Installation provisioning, non-secret values only. Both paths are on the
  # mounted volume so an issued credential and a stored project key survive a
  # restart. The secrets and REALBUD_GATEWAY_PUBLIC_ORIGIN come from deploy.sh.
  REALBUD_GATEWAY_SECRETS_DIR = '/data/secrets'
  REALBUD_GATEWAY_CONNECTOR_REGISTRY = '/data/connectors.json'
  REALBUD_MODELVIA_BASE_URL = 'https://api.modelvia.dev'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # /ready is 200 only when installation provisioning is composed; a misconfigured
  # deployment fails its health check instead of serving 503s to the portal.
  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    path = '/ready'
    timeout = '5s'

[[vm]]
  size = 'shared-cpu-2x'
  memory = '1024mb'

[mounts]
  source = 'gateway_data'
  destination = '/data'

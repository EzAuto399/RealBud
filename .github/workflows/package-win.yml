# Windows installer, built on a real Windows runner and published as a
# workflow artifact.
#
# Why this exists: releases are cut by hand from a Mac, which cannot build
# an NSIS installer (electron-builder needs wine, and a cross-built exe
# that never ran on Windows is exactly the artifact that looks fine and
# breaks in the field). So every release so far shipped Windows behind the
# mac build — different trees under one version number. Run this from the
# same commit as the mac build and attach the artifact to the release.
#
# Deliberately artifact-only: pushing straight to the separate releases
# repo would need a cross-repo token this workflow has no business holding.
name: Package Windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit/tag/branch to build (defaults to the branch this is run from)"
        required: false
        type: string

jobs:
  package:
    name: NSIS installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: focused workflow safety checks
        run: pnpm exec vitest run server/bank-reference.test.ts server/human-handoffs.test.ts server/local-computer.test.ts electron/capabilities.test.mjs
      # the packaged app ships compiled JS, so a stale dist/ or dist-server/
      # would ride along unsigned-for and unsealed (the 0.1.15 "damaged"
      # incident) — a fresh checkout is clean, but be explicit
      - name: clean build outputs
        shell: bash
        run: rm -rf dist dist-server release
      - run: pnpm package:win
      - name: Install and verify the actual NSIS artifact on Windows Server
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:REALBUD_BUILD_SHA = (git rev-parse HEAD).Trim()
          $installer = Get-ChildItem release/*-setup.exe | Select-Object -First 1
          if (!$installer) { throw 'No installer produced' }
          $destination = Join-Path $env:RUNNER_TEMP 'RealBudInstallerProof'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S /D=$destination" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS failed: $($install.ExitCode)" }
          $app = Join-Path $destination 'RealBud.exe'
          if (!(Test-Path $app)) { throw 'Installed application missing' }
          $env:ELECTRON_RUN_AS_NODE = '1'
          & $app scripts/smoke-windows-package.mjs "$destination/resources" release/windows-runtime-proof.json
          if ($LASTEXITCODE -ne 0) { throw 'Installed runtime proof failed' }
          Remove-Item Env:ELECTRON_RUN_AS_NODE
          $manifest = @{ sourceRevision = $env:REALBUD_BUILD_SHA; runnerOS = (Get-CimInstance Win32_OperatingSystem).Caption; architecture = $env:PROCESSOR_ARCHITECTURE; installerSha256 = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash; windows11Verified = $false }
          $manifest | ConvertTo-Json | Set-Content release/windows-build-proof.json
      - name: report what was built
        shell: bash
        run: |
          echo "version: $(node -p "require('./package.json').version")"
          echo "commit:  $(git rev-parse HEAD)"
          ls -lh release/*.exe release/*.yml 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
            release/windows-runtime-proof.json
            release/windows-build-proof.json
          if-no-files-found: error
          retention-days: 14

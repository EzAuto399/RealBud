# Windows installer, built on a real Windows runner and published as a
# workflow artifact.
#
# Why this exists: releases are cut by hand from a Mac, which cannot build
# an NSIS installer (electron-builder needs wine, and a cross-built exe
# that never ran on Windows is exactly the artifact that looks fine and
# breaks in the field). So every release so far shipped Windows behind the
# mac build — different trees under one version number. Run this from the
# same commit as the mac build and attach the artifact to the release.
#
# Deliberately artifact-only: pushing straight to the separate releases
# repo would need a cross-repo token this workflow has no business holding.
name: Package Windows

permissions:
  contents: read

# Windows behaviour is only ever proven by a real win32 run, so main builds and
# installs on every push instead of waiting for someone to remember the dispatch.
# Manual dispatch stays, still able to build any ref for a release cut.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit/tag/branch to build (defaults to the branch this is run from)"
        required: false
        type: string
      proof:
        description: "Use all for candidate acceptance; select one job only for diagnosis"
        type: choice
        default: all
        options:
          - all
          - installer
          - managed-runtime

# One Windows package per ref: a superseded push has nothing left to prove, and
# a dispatched release build keeps its own group so a push cannot cancel it.
concurrency:
  group: package-win-${{ github.event_name }}-${{ inputs.ref || github.ref }}-${{ inputs.proof || 'all' }}
  cancel-in-progress: true

jobs:
  package:
    if: github.event_name != 'workflow_dispatch' || inputs.proof != 'managed-runtime'
    name: NSIS installer
    runs-on: windows-latest
    timeout-minutes: 30
    # id-token lets main sign through Azure Artifact Signing over OIDC: no
    # client secret exists anywhere. The federated credential on the Entra app
    # (vars.AZURE_CLIENT_ID) trusts refs/heads/main of this repo only.
    permissions:
      contents: read
      id-token: write
    env:
      # Signing turns on once the certificate profile exists (it needs a
      # completed identity validation first). Until then main builds unsigned.
      SIGN_WINDOWS: ${{ vars.AZURE_SIGN_PROFILE != '' && github.ref == 'refs/heads/main' && (inputs.ref == '' || inputs.ref == 'main' || inputs.ref == 'refs/heads/main' || inputs.ref == github.sha) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Windows compiler and acceptance prerequisites
        run: node scripts/check-windows-build.mjs --proof
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:windows-build
      - name: Compile Windows launchers and exercise process cleanup
        run: |
          pnpm build:worker:win
          pnpm build:cua-launcher:win
          pnpm exec vitest run server/one-shot-process.test.ts server/worker-supervisor.native.test.ts server/procs.test.ts electron/cua-launcher.test.mjs electron/cua-windows-host.test.mjs electron/cua-lifecycle.test.mjs electron/speech-helper-win.test.mjs
      - name: Windows packaging fixtures
        run: pnpm exec vitest run electron/package-files.test.mjs electron/perm-settings.test.mjs electron/service-smoke.test.mjs
      # the packaged app ships compiled JS, so a stale dist/ or dist-server/
      # would ride along unsigned-for and unsealed (the 0.1.15 "damaged"
      # incident) — a fresh checkout is clean, but be explicit
      - name: clean build outputs
        shell: bash
        run: rm -rf dist dist-server release
      # The pinned PostgreSQL archive comes from EDB's download host, which has
      # gone away mid-day (HTTP 404 for every file id). prepare-postgres still
      # verifies the cached bytes against the pinned SHA-256 before use.
      - uses: actions/cache@v4
        with:
          path: .postgres-cache
          key: postgres-${{ runner.os }}-${{ hashFiles('scripts/postgres-artifacts.mjs') }}
      - name: Azure login for signing (OIDC)
        if: env.SIGN_WINDOWS == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # The GitHub OIDC assertion expires within minutes and the signer only
      # asks for a token at the end of packaging, so fetch it now; az caches it
      # for the rest of the job and AzureCliCredential reads that cache.
      - name: Prefetch signing token
        if: env.SIGN_WINDOWS == 'true'
        run: az account get-access-token --resource https://codesigning.azure.net --output none
      - name: pnpm package:win
        shell: bash
        env:
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}
        run: |
          if [ "$SIGN_WINDOWS" = "true" ]; then
            : "${AZURE_SIGN_PROFILE:?Set AZURE_SIGN_PROFILE to the approved certificate profile}"
            : "${AZURE_SIGN_PUBLISHER:?Set AZURE_SIGN_PUBLISHER to the certificate CN}"
            # publisherName must equal the certificate CN exactly: it lands in
            # app-update.yml and electron-updater rejects updates signed by
            # anyone else. Keep it stable or list old and new names.
            pnpm package:win \
              -c.forceCodeSigning=true \
              "-c.win.azureSignOptions.publisherName=$AZURE_SIGN_PUBLISHER" \
              -c.win.azureSignOptions.endpoint=https://eus.codesigning.azure.net/ \
              -c.win.azureSignOptions.codeSigningAccountName=realbudsigning \
              "-c.win.azureSignOptions.certificateProfileName=$AZURE_SIGN_PROFILE"
          else
            pnpm package:win
          fi
      - name: Verify Authenticode signatures
        if: env.SIGN_WINDOWS == 'true'
        shell: pwsh
        env:
          AZURE_SIGN_PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem release/RealBud-*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one signed installer.' }
          $files = $installers + @(Get-Item release/win-unpacked/RealBud.exe)
          foreach ($f in $files) {
            $sig = Get-AuthenticodeSignature $f.FullName
            "$($f.Name): $($sig.Status) $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "$($f.Name) is not validly signed" }
            $publisher = $sig.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
            if ($publisher -cne $env:AZURE_SIGN_PUBLISHER) { throw "$($f.Name) has an unexpected publisher: $publisher" }
            if (-not $sig.TimeStamperCertificate) { throw "$($f.Name) has no trusted timestamp" }
          }
      - name: Install and exercise the packaged Windows runtime
        shell: pwsh
        run: |
          $env:REALBUD_BUILD_SHA = git rev-parse HEAD
          $installers = @(Get-ChildItem release/RealBud-*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows x64 installer.' }
          ./scripts/test-windows-installer.ps1 -Installer $installers[0].FullName -ReceiptDirectory release/windows-proof
      - name: report what was built
        shell: bash
        run: |
          echo "version: $(node -p "require('./package.json').version")"
          echo "commit:  $(git rev-parse HEAD)"
          ls -lh release/*.exe release/*.yml 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installed-proof
          path: release/windows-proof/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*.zip
            release/latest.yml
          if-no-files-found: error
          retention-days: 14

  memory-journal:
    if: github.event_name != 'workflow_dispatch' || inputs.proof != 'installer'
    name: Managed Windows runtime and native memory journal (held candidate)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:worker:win
      - name: Verify setup diagnostic controls on native PowerShell
        run: node --test scripts/testing/prepare-windows-memory-runtime.test.mjs
      - name: Verify managed setup environment and cancellation
        run: pnpm exec vitest run server/worker-bootstrap.test.ts
      - name: Prepare the exact runtime through managed setup
        timeout-minutes: 25
        shell: pwsh
        run: |
          $env:REALBUD_BUILD_SHA = git rev-parse HEAD
          node scripts/testing/prepare-windows-memory-runtime.mjs outputs/windows-native-memory/runtime.json
      - name: Exercise the real Windows journal while preserving public holds
        timeout-minutes: 30
        shell: pwsh
        run: |
          $runtime = Get-Content -Raw outputs/windows-native-memory/runtime.json | ConvertFrom-Json
          if (-not $runtime.passed) { throw 'Managed runtime setup did not pass.' }
          if ($runtime.sourceRevision -ne (git rev-parse HEAD).Trim()) { throw 'Managed runtime receipt identifies another source revision.' }
          $python = Join-Path $runtime.runtimeDirectory 'venv/Scripts/python.exe'
          & $python -I -B scripts/testing/hermes-memory-windows-journal-native.py --runtime $runtime.runtimeDirectory --helpers server/helpers --admission server/hermes-memory-review.ts --source-revision $runtime.sourceRevision --receipt outputs/windows-native-memory/journal.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-memory-journal-proof
          path: outputs/windows-native-memory/
          if-no-files-found: warn
          retention-days: 14

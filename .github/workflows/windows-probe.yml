name: Windows probe

# Manual, minutes-long diagnosis of the Windows-only pieces (private-storage
# ACL admission and its dependent suites, or focused retention regressions)
# without waiting for the full CI matrix. Evidence only; it gates nothing.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Windows suite to exercise
        type: choice
        required: true
        default: privacy
        options:
          - privacy
          - retention
  # Dispatch only resolves on the default branch, so a pull request that touches
  # the Windows privacy pieces runs the probe on its own.
  pull_request:
    paths:
      - .github/workflows/windows-probe.yml
      - scripts/testing/probe-windows-acl.mjs
      - scripts/testing/probe-windows-powershell-env.mjs
      - scripts/qa-private-backup-boundaries.mjs
      - server/windows-file-privacy*.ts
      - server/private-file.ts
      - server/private-vault.ts
      - server/hermes-profile-storage.ts
      - server/testing/private-fixture.ts
      - server/testing/private-profile-fixture.ts
      - electron/desk-key-custody.test.mjs
      - server/accounts-review.test.ts
      - server/agency-setup.test.ts
      - server/attended-run.test.ts
      - server/batches.test.ts
      - server/bill-proposals.test.ts
      - server/bill-review-drafts.test.ts
      - server/bill-review-http.test.ts
      - server/browser-broker.test.ts
      - server/browser-runtime.test.ts
      - server/channel-pairing.test.ts
      - server/company-installation.test.ts
      - server/company-installation-binding.test.ts
      - server/company/host-runtime.test.ts
      - server/company/postgres-runtime.test.ts
      - server/customer-pack-archive.review.test.ts
      - server/customer-pack-archive.test.ts
      - server/customer-pack-skill-history.test.ts
      - server/customer-pack-upgrades.test.ts
      - server/customer-packs.test.ts
      - server/desk.test.ts
      - server/drivers/acp/acp.test.ts
      - server/drivers/acp/memory-proposals.test.ts
      - server/hermes-profile-windows.test.ts
      - server/job-executor.test.ts
      - server/job-runs.test.ts
      - server/mail-ingestion.test.ts
      - server/mail-retention.test.ts
      - server/mail-workspace-http.test.ts
      - server/manual-job-request.test.ts
      - server/morning-mail-scheduler.test.ts
      - server/office-link.test.ts
      - server/private-backup-archive.test.ts
      - server/private-backup-bank-amendment.test.ts
      - server/private-backup-bank-retention.test.ts
      - server/private-backup-bill-review.test.ts
      - server/private-backup-capture.test.ts
      - server/private-backup-catalog.test.ts
      - server/private-backup-cold-restore.test.ts
      - server/private-backup-coordinator.test.ts
      - server/private-backup-department-work.test.ts
      - server/private-backup-legacy.test.ts
      - server/private-backup-mail-retention.test.ts
      - server/private-backup-mail-validation.test.ts
      - server/private-backup-operations.test.ts
      - server/private-backup-pack-upgrade.test.ts
      - server/private-backup-prepare.test.ts
      - server/private-backup-prepared.test.ts
      - server/private-backup-proposal-retention.test.ts
      - server/private-backup-resource-runtime.test.ts
      - server/private-backup-resources.test.ts
      - server/private-backup-restore-catalog.test.ts
      - server/private-backup-skill-history.test.ts
      - server/private-backup-source-bills.test.ts
      - server/private-backup-v2-bootstrap.test.ts
      - server/private-backup-v2-integration.test.ts
      - server/private-backup-website-requests.test.ts
      - server/private-workspace-backup.test.ts
      - server/routines-recovery.test.ts
      - server/routines.test.ts
      - server/service-admin-provision.test.ts
      - server/source-bills-api.test.ts
      - server/testing/private-profile-fixture.test.ts
      - server/vault.test.ts
      - server/website-remote-approvers.test.ts
      - server/website-remote-work.test.ts
      - server/windows-created-privacy.test.ts
      - server/workspace-identity.test.ts
      - server/workspace-tabs.test.ts

permissions:
  contents: read

jobs:
  acl:
    name: ACL admission probe (windows-latest)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite != 'retention' }}
    runs-on: windows-latest
    # The fixture-dependent suites below took about 80 min in failing CI shards
    # (several slow tests are now skipped or bounded on Windows); allow for that.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Runner facts
        shell: pwsh
        run: |
          "PSModulePath=$env:PSModulePath"
          "TEMP=$env:TEMP RUNNER_TEMP=$env:RUNNER_TEMP"
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString(); (Get-Command Set-Acl).Module.Path; [System.Security.Principal.WindowsIdentity]::GetCurrent().Name'
      - name: PowerShell launch cost under the installed service's stripped environment
        continue-on-error: true
        run: node scripts/testing/probe-windows-powershell-env.mjs --all
      - name: ACL admission in every storage root, inherited and relocated home
        continue-on-error: true
        run: node --experimental-strip-types scripts/testing/probe-windows-acl.mjs
      - name: Smallest ACL-dependent suites
        # Plus every suite whose fixtures stand in for private objects the product
        # admits (server/testing/private-fixture.ts); one line for pwsh.
        run: >-
          pnpm exec vitest run
          server/private-file.test.ts
          server/private-vault.test.ts
          server/hermes-profile-storage.test.ts
          server/windows-file-privacy.test.ts
          server/windows-file-privacy-sync.test.ts
          server/windows-file-privacy-diagnostics.test.ts
          server/testing/private-profile-fixture.test.ts
          electron/desk-key-custody.test.mjs
          server/accounts-review.test.ts
          server/agency-setup.test.ts
          server/attended-run.test.ts
          server/batches.test.ts
          server/bill-proposals.test.ts
          server/bill-review-drafts.test.ts
          server/bill-review-http.test.ts
          server/browser-broker.test.ts
          server/browser-runtime.test.ts
          server/channel-pairing.test.ts
          server/company-installation.test.ts
          server/company-installation-binding.test.ts
          server/company/host-runtime.test.ts
          server/company/postgres-runtime.test.ts
          server/customer-pack-archive.review.test.ts
          server/customer-pack-archive.test.ts
          server/customer-pack-skill-history.test.ts
          server/customer-pack-upgrades.test.ts
          server/customer-packs.test.ts
          server/desk.test.ts
          server/drivers/acp/acp.test.ts
          server/drivers/acp/memory-proposals.test.ts
          server/hermes-profile-windows.test.ts
          server/job-executor.test.ts
          server/job-runs.test.ts
          server/mail-ingestion.test.ts
          server/mail-retention.test.ts
          server/mail-workspace-http.test.ts
          server/manual-job-request.test.ts
          server/morning-mail-scheduler.test.ts
          server/office-link.test.ts
          server/private-backup-archive.test.ts
          server/private-backup-bank-amendment.test.ts
          server/private-backup-bank-retention.test.ts
          server/private-backup-bill-review.test.ts
          server/private-backup-capture.test.ts
          server/private-backup-catalog.test.ts
          server/private-backup-cold-restore.test.ts
          server/private-backup-coordinator.test.ts
          server/private-backup-department-work.test.ts
          server/private-backup-legacy.test.ts
          server/private-backup-mail-retention.test.ts
          server/private-backup-mail-validation.test.ts
          server/private-backup-operations.test.ts
          server/private-backup-pack-upgrade.test.ts
          server/private-backup-prepare.test.ts
          server/private-backup-prepared.test.ts
          server/private-backup-proposal-retention.test.ts
          server/private-backup-resource-runtime.test.ts
          server/private-backup-resources.test.ts
          server/private-backup-restore-catalog.test.ts
          server/private-backup-skill-history.test.ts
          server/private-backup-source-bills.test.ts
          server/private-backup-v2-bootstrap.test.ts
          server/private-backup-v2-integration.test.ts
          server/private-backup-website-requests.test.ts
          server/private-workspace-backup.test.ts
          server/routines-recovery.test.ts
          server/routines.test.ts
          server/service-admin-provision.test.ts
          server/source-bills-api.test.ts
          server/vault.test.ts
          server/website-remote-approvers.test.ts
          server/website-remote-work.test.ts
          server/windows-created-privacy.test.ts
          server/workspace-identity.test.ts
          server/workspace-tabs.test.ts
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Private backup restore boundaries from source
        if: always()
        run: node scripts/qa-private-backup-boundaries.mjs
        env:
          QA_OUTPUT: outputs/windows-probe-private-backup.json

  retention:
    name: Focused retention regressions (windows-latest)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite == 'retention' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compile Windows launchers for native process tests
        run: |
          pnpm build:worker:win
          pnpm build:cua-launcher:win
      - name: Retention regression suites
        run: >-
          pnpm exec vitest run
          server/bank-reference-http.test.ts
          server/bill-proposals.test.ts
          server/private-backup-bank-retention.test.ts
        env:
          NODE_OPTIONS: --max-old-space-size=6144

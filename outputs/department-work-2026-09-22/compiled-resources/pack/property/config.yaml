# Locked RealBud worker. Do not flip approvals to off/smart/yolo.
# Attach Bud's own model login from RealBud (You → Bud). Do not inherit a
# Hermes Desktop profile login. Change with: hermes -p property model
# Bud gets a private working home and starts in RealBud's property vault.
# Safe reads, research, calculations, code, and working-file edits may run;
# dangerous commands still route through the manual approval callback below.
approvals:
  mode: manual
  timeout: 300
  cron_mode: deny
  mcp_reload_confirm: true
agent:
  max_turns: 60
  verbose: false
# Keep a long CSV/JSON line intact within the overall read budget. Upstream's
# smaller per-line default can hide the tail without a resumable line offset.
# Larger reads must still report partial coverage; this is not unlimited input.
file_read_max_chars: 32000
tool_output:
  max_line_length: 32000
  max_lines: 2000
  max_bytes: 50000
# Prepare CLI jobs use this bounded toolset. Hermes ACP supplies its own native
# bundle; this list does not disable ACP execute_code. RealBud's adapter forces
# upstream HERMES_EXEC_ASK so native scripts require a whole-script decision.
toolsets:
  - web
  - terminal
  - file
  - vision
  - todo
  - session_search
  - delegation
security:
  redact_secrets: true
# Native foreground and background learning proposes durable changes for review.
# RealBud enables the learner only for its exact admitted runtime during Repair.
skills:
  write_approval: true
memory:
  write_approval: true
auxiliary:
  background_review:
    enabled: false
    extra_tools: []
delegation:
  max_concurrent_children: 2
  max_iterations: 24
terminal:
  backend: local
  home_mode: profile
  timeout: 120
  env_passthrough: []

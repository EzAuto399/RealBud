appId: com.realbud.app
productName: RealBud
artifactName: RealBud-${version}-${arch}.${ext}

# In-app auto-update reads latest-mac.yml + the .zip (macOS) or latest.yml +
# the NSIS .exe (Windows) from this PUBLIC releases repo (separate from the
# source repo). Public → no token on users' machines. Baked into
# app-update.yml; both metadata files are emitted here even with
# --publish never, and must be uploaded to the GitHub release alongside the
# artifacts — a release missing latest.yml leaves every Windows install
# stranded on its installed version.
publish:
  - provider: github
    owner: EzAuto399
    repo: RealBud

directories:
  buildResources: build
  output: release

# The app is three self-contained pieces, none needing node_modules at
# runtime: the Electron main/preload (plain .mjs/.cjs), the built UI
# (Vite → ui/), and the compiled harness server (tsc → server/), both
# shipped in Resources and run on Electron's own Node via
# ELECTRON_RUN_AS_NODE (the agentcal-hq pattern).
files:
  - electron/**
  - "!electron/**/*.test.*"
  - "!electron/resources/speech-helper"
  - "!electron/resources/speech-helper.swift"
  - "!electron/resources/speech-helper-Info.plist"
  - "!electron/resources/RealBud Speech.app/**"
  - "!**/node_modules/**"
  - package.json

asar: true

extraResources:
  - from: dist
    to: ui
  - from: dist-server/server
    to: server
  - from: dist-server/shared
    to: shared
  # The compiled server resolves the code-owned safety pack from
  # Resources/pack/property. Keep this outside ASAR on every platform so a
  # first-run Bud setup can install and verify it without touching Hermes.
  - from: pack/property
    to: pack/property

mac:
  target:
    - dmg
    - zip
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # the dictation helper is a signed background app — Windows and Linux never see it
  extraResources:
    - from: electron/resources/RealBud Speech.app
      to: RealBud Speech.app
    # CUA must live outside ASAR. prepare-cua stages the signed executable and
    # a self-contained JS/native SDK bundle selected for the build host arch.
    - from: dist-native/cua-driver
      to: cua-driver
    - from: dist-native/cua-sdk
      to: cua-sdk
  extendInfo:
    NSMicrophoneUsageDescription: RealBud uses the microphone for voice dictation into the composer.
    NSSpeechRecognitionUsageDescription: RealBud transcribes your voice on-device to type messages for you.
    NSAccessibilityUsageDescription: RealBud uses Accessibility only for visible, approved browser work.
    NSScreenCaptureUsageDescription: RealBud reads the approved browser window so Bud can prepare a bounded handoff.
  # Training/QA packages are intentionally not distributable. The gated
  # package:mac:release command overrides this to true only after the named
  # pilot, clean-checkout, Developer ID and Apple credential preflight.
  notarize: false

dmg:
  sign: true
  artifactName: RealBud-${version}.dmg

win:
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64
  icon: build/icon.ico
  # The ordinary package:win command is an unsigned QA artifact. The gated
  # package:win:release command requires WIN_CSC_LINK and lets
  # electron-builder sign every executable and derive publisherName from the
  # certificate. Preserve that subject (or explicitly list old + new during
  # rotation) so updater signature verification does not strand installs.

nsis:
  oneClick: true
  perMachine: false
  shortcutName: RealBud
  # Versioned, like the .dmg. A stable RealBud-setup.exe can sit beside
  # RealBud-${version}-setup.exe on a release.
  artifactName: RealBud-${version}-setup.${ext}

linux:
  target:
    - target: AppImage
      arch: x64
    - target: deb
      arch: x64
  # Keep the vector source in the freedesktop scalable icon hierarchy. A
  # lone 1024px PNG is not indexed by GNOME's hicolor theme on Ubuntu 24.04.
  icon: build/icon.svg
  category: Utility
  executableName: realbud
  synopsis: A desk for real-estate agents and property managers
  description: RealBud — local-first agents for rent, owners, and the building portal.
  maintainer: EzAuto399 <75935138+EzAuto399@users.noreply.github.com>
  vendor: RealBud
  syncDesktopName: true
  desktop:
    entry:
      Name: RealBud
      Comment: A desk for real-estate agents and property managers
      Keywords: AI;Agents;Chat;Productivity;

deb:
  packageCategory: utils
  priority: optional

# Static AppImage runtime: Ubuntu 24.04 can launch it without legacy FUSE 2.
toolsets:
  appimage: "1.0.3"

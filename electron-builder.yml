appId: com.realbud.app
productName: RealBud
artifactName: RealBud-${version}-${arch}.${ext}

# In-app auto-update reads latest-mac.yml + the .zip (macOS) or latest.yml +
# the NSIS .exe (Windows) from this PUBLIC releases repo (separate from the
# source repo). Public → no token on users' machines. Baked into
# app-update.yml; both metadata files are emitted here even with
# --publish never, and must be uploaded to the GitHub release alongside the
# artifacts — a release missing latest.yml leaves every Windows install
# stranded on its installed version.
publish:
  - provider: github
    owner: EzAuto399
    repo: RealBud

directories:
  buildResources: build
  output: release

# The app is three self-contained pieces, none needing node_modules at
# runtime: the Electron main/preload (plain .mjs/.cjs), the built UI
# (Vite → ui/), and the compiled harness server (tsc → server/), both
# shipped in Resources and run on Electron's own Node via
# ELECTRON_RUN_AS_NODE (the agentcal-hq pattern).
files:
  - electron/**
  # Electron main imports the same installation identity as the server. The
  # server's extraResources copy is outside ASAR and cannot satisfy this import.
  - shared/service-identity.mjs
  - shared/local-session.mjs
  - "!electron/**/*.test.*"
  - "!electron/resources/speech-helper"
  - "!electron/resources/speech-helper.swift"
  - "!electron/resources/speech-helper-win.cs"
  - "!electron/resources/speech-helper-Info.plist"
  - "!electron/resources/RealBud Speech.app/**"
  - "!electron/resources/RealBud Speech.exe"
  - "!electron/resources/worker-supervisor-win.cs"
  - "!electron/resources/cua-launcher-win.cs"
  - "!electron/resources/RealBud Worker.exe"
  - "!**/node_modules/**"
  - package.json

asar: true
afterSign: scripts/seal-mac-browser.mjs

extraResources:
  # Only the reviewed Hermes native engine ships. Old BrowserSkill staging
  # must not accidentally reintroduce an extension requirement.
  - from: dist-browser/hermes-native
    to: browser/hermes-native
  - from: dist
    to: ui
  - from: dist-server/server
    to: server
  - from: dist-server/shared
    to: shared
  - from: dist-server/src
    to: src
  - from: pack/property
    to: pack/property
  # Portable customer packs are loaded relative to the compiled server.
  # Include only the reviewed public pack text, never workspace/customer data.
  - from: pack/workflows/austin-accounts
    to: pack/workflows/austin-accounts
  - from: pack/workflows/austin-office
    to: pack/workflows/austin-office
  - from: pack/workflows/office-core
    to: pack/workflows/office-core
  - from: pack/workflows/department-starters
    to: pack/workflows/department-starters
  # Sherry's role pack (austin-property) is built from this one reviewed plan; its fixtures stay out.
  - from: pack/workflows/austin-maintenance-rehearsal
    to: pack/workflows/austin-maintenance-rehearsal
    filter:
      - realbud-austin-maintenance-rehearsal-v1.json
  # Admitted PostgreSQL 16 runtime for "Set up this office". Staged by
  # `pnpm build:postgres`, which fails the build rather than shipping an
  # installer whose Set up button cannot provision storage. Resolved at setup
  # time by server/company/postgres-runtime.ts as <resources>/postgres/bin.
  - from: dist-postgres
    to: postgres

mac:
  # The pinned CUA driver and SDK require macOS 13; speech uses the same floor.
  minimumSystemVersion: "13.0"
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # the dictation helper is a signed background app — Windows never sees it
  extraResources:
    - from: electron/resources/RealBud Speech.app
      to: RealBud Speech.app
    # CUA must live outside ASAR. prepare-cua stages the signed executable and
    # a self-contained JS/native SDK bundle selected for macOS arm64.
    - from: dist-native/cua-driver
      to: cua-driver
    - from: dist-native/cua-sdk
      to: cua-sdk
  extendInfo:
    NSMicrophoneUsageDescription: RealBud uses the microphone for voice dictation into the composer.
    NSSpeechRecognitionUsageDescription: RealBud transcribes your voice on-device to type messages for you.
    NSAccessibilityUsageDescription: RealBud uses Accessibility when you let a bot control this Mac.
    NSScreenCaptureUsageDescription: RealBud uses Screen Recording so bots can see this Mac before acting.
    NSLocalNetworkUsageDescription: RealBud uses your local network so other computers in your office can connect to this one.
  # Notarization stays off in electron-builder; run after the build:
  #   NOTARY_KEYCHAIN_PROFILE=realbud-notary pnpm package:mac:notarize
  # See docs/GRADUATE-RELEASE.md Wave 1.
  notarize: false

dmg:
  sign: true
  artifactName: RealBud-${version}.dmg
  title: RealBud ${version}
  # Install window: build/dmg-background.html → scripts/render-dmg-background.mjs
  # renders the 1x/@2x PNGs. Icon centres must match the HTML's label band.
  background: build/dmg-background.png
  iconSize: 96
  window:
    width: 660
    height: 420
  contents:
    - x: 170
      y: 222
      type: file
    - x: 490
      y: 222
      type: link
      path: /Applications

win:
  extraResources:
    - from: electron/resources/RealBud Speech.exe
      to: RealBud Speech.exe
    - from: electron/resources/RealBud Worker.exe
      to: RealBud Worker.exe
    - from: dist-native
      to: .
      filter:
        - cua-driver.exe
        - RealBud CUA.exe
        - cua-driver-uia.exe
        - cua-cursor-theme.exe
        - cua_driver_sdk.dll
        - cua_driver_node_runtime.node
    - from: dist-native/cua-sdk
      to: cua-sdk
  target:
    - target: nsis
      arch: x64
    - target: zip
      arch: x64
  icon: build/icon.ico
  # Signing is NOT configured here: local and branch builds stay unsigned.
  # .github/workflows/package-win.yml adds win.azureSignOptions on the CLI
  # (Azure Artifact Signing, account realbudsigning, OIDC login) only on main
  # and only once repo variable AZURE_SIGN_PROFILE is set. Unsigned builds
  # carry no publisherName, so electron-updater skips verification. Signed
  # builds write publisherName (vars.AZURE_SIGN_PUBLISHER) into app-update.yml:
  # keep the cert subject stable (or list both old and new names) or every
  # installed signed copy rejects the next update.

nsis:
  oneClick: true
  perMachine: false
  shortcutName: RealBud
  uninstallDisplayName: RealBud
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  # Versioned, like the .dmg. A stable RealBud-setup.exe can sit beside
  # RealBud-${version}-setup.exe on a release.
  artifactName: RealBud-${version}-setup.${ext}
